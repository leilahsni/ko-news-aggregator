[project]
name = "app"
version = "0.1.0"
description = "Korean News Aggregator & Translator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "deep-translator>=1.11.4",
    "fastapi>=0.142.2",
    "feedparser>=6.0.14",
    "googlenewsdecoder>=0.2.1",
    "jinja2>=3.1.6",
    "playwright>=1.63.0",
    "requests>=2.34.2",
    "trafilatura>=2.2.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
